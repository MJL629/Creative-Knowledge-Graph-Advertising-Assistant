name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: creative_graph
          POSTGRES_PASSWORD: creative_graph
          POSTGRES_DB: creative_graph_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U creative_graph -d creative_graph_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CREATIVE_MODEL_PROVIDER: mock
      PERSISTENCE_PROVIDER: memory
      WORKFLOW_CHECKPOINTER: memory
      POSTGRES_TEST_DATABASE_URL: postgres://creative_graph:creative_graph@localhost:5432/creative_graph_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run test:postgres
      - run: npm run test:workflow:postgres
