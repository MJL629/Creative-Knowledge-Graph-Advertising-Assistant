services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: creative_graph
      POSTGRES_PASSWORD: creative_graph
      POSTGRES_DB: creative_graph_test
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creative_graph -d creative_graph_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - creative_graph_postgres_data:/var/lib/postgresql/data

volumes:
  creative_graph_postgres_data:
